name: Convert to STEP

on:
  workflow_call:
    inputs:
      detector_configs:
        required: true
        type: string
      install_artifact_name:
        required: true
        type: string
      organization:
        required: false
        type: string
        default: eicweb
      platform-release:
        required: false
        type: string
        default: eic_xl:nightly
      epic_setup_script:
        required: false
        type: string
        default: /opt/detector/epic-main/bin/thisepic.sh
      lsan_options:
        required: false
        type: string
        default: suppressions=${{ github.workspace }}/.github/lsan.supp
      asan_options:
        required: false
        type: string
        default: suppressions=${{ github.workspace }}/.github/asan.supp:malloc_context_size=20:detect_leaks=1:verify_asan_link_order=0:detect_stack_use_after_return=1:detect_odr_violation=1:new_delete_type_mismatch=0:intercept_tls_get_addr=0
      ubsan_options:
        required: false
        type: string
        default: suppressions=${{ github.workspace }}/.github/ubsan.supp:print_stacktrace=1:silence_unsigned_overflow=1:report_error_type=1
      tsan_options:
        required: false
        type: string
        default: suppressions=${{ github.workspace }}/.github/tsan.supp

permissions:
  contents: read
  actions: read

jobs:
  convert-to-step:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        detector_config: ${{fromJson(inputs.detector_configs)}}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.install_artifact_name }}
          path: .
      - name: Uncompress install artifact
        run: tar -xaf install.tar.zst
      - uses: cvmfs-contrib/github-action-cvmfs@v5
      - uses: eic/run-cvmfs-osg-eic-shell@main
        env:
          LSAN_OPTIONS: ${{ inputs.lsan_options }}
          ASAN_OPTIONS: ${{ inputs.asan_options }}
          UBSAN_OPTIONS: ${{ inputs.ubsan_options }}
          TSAN_OPTIONS: ${{ inputs.tsan_options }}
        with:
          organization: "${{ inputs.organization }}"
          platform-release: "${{ inputs.platform-release }}"
          setup: ${{ inputs.epic_setup_script }}
          run: |
            export PATH=$PWD/install/bin${PATH:+:$PATH}
            export LD_LIBRARY_PATH=$PWD/install/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}
            # For some reason npdet_to_step really wants a space in IFS
            IFS=$' \n\t'
            # First get all detectors (except world)
            declare -A detectors
            while read d ; do detectors[$d]='-l 3' ; done <<< $(npdet_to_step list $DETECTOR_PATH/${{matrix.detector_config}}.xml  | sed '/world/d;s/.*(vol: \(.*\)).*/\1/g')
            # Then tweak the levels (default is 1)
            detectors[EcalBarrelImaging]='-l 4'
            detectors[HcalBarrel]='-l 1'
            detectors[LFHCAL]='-l 2'
            detectors[OuterBarrelMPGDSubAssembly]='-l 4'
            # Export to one STEP file
            set -o pipefail
            npdet_to_step $(for d in ${!detectors[@]} ; do echo part ${detectors[$d]} $d ; done) -o ${{matrix.detector_config}} $DETECTOR_PATH/${{matrix.detector_config}}.xml
            test -s ${{matrix.detector_config}}.stp
      - uses: actions/upload-artifact@v7
        with:
          name: ${{matrix.detector_config}}.stp
          path: ${{matrix.detector_config}}.stp
          if-no-files-found: error
